<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OrganicPlus — responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#dce0d5;font:14px Arial;color:#14261b}header{padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:10px 13px;min-height:44px;border:1px solid #829278;border-radius:5px;background:white;color:#14261b;cursor:pointer}button[aria-pressed=true]{background:#14261b;color:white}main{display:flex;justify-content:center;padding:10px 0 30px;min-width:max-content}iframe{border:0;flex-shrink:0;width:390px;height:844px;box-shadow:0 4px 30px #0002;background:#faf9f4}a{color:inherit}label{font-size:12px}</style></head><body><header><strong>OrganicPlus review</strong><button data-width="360" aria-pressed="false">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button><button data-width="1280" aria-pressed="false">Desktop</button><label for="page">Page</label><select id="page"><option value="/">Homepage</option><option value="/harvest-booster/">Harvest Booster</option><option value="/growth-booster/">Growth Booster</option><option value="/stockists/">Stockists</option><option value="/about/">About &amp; contact</option></select><a id="direct" href="/">Open page directly ↗</a></header><main><iframe id="preview" src="/" title="OrganicPlus website"></iframe></main><script>const frame=document.getElementById('preview'),page=document.getElementById('page'),direct=document.getElementById('direct');document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));frame.style.width=button.dataset.width+'px'}));page.addEventListener('change',()=>{frame.src=page.value;direct.href=page.value});</script></body></html>
