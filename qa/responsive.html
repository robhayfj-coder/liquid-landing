<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Harvest Booster — responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#dce0d5;font:14px Arial;color:#14261b}header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:10px 15px;border:1px solid #829278;border-radius:5px;background:white;cursor:pointer}button[aria-pressed=true]{background:#14261b;color:white}main{display:flex;justify-content:center;padding:10px 0 30px}iframe{border:0;width:390px;height:844px;box-shadow:0 4px 30px #0002;background:#faf9f4}p{margin:0}a{color:inherit}</style></head><body><header><strong>Responsive review</strong><button data-width="360" aria-pressed="false">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button><button data-width="1280" aria-pressed="false">Desktop</button><p>Real page in a narrow viewport. <a href="../index.html">Open page directly ↗</a></p></header><main><iframe id="preview" src="../index.html" title="Harvest Booster landing page"></iframe></main><script>document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.getElementById('preview').style.width=button.dataset.width+'px'}));</script></body></html>
